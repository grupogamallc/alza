.primary{background:linear-gradient(90deg,var(--gold),var(--amber));color:var(--ink);box-shadow:0 10px 26px -12px var(--amber)}

.ring{border-radius:50%;display:grid;place-items:center;flex:none}

.p-hero{position:relative;border-radius:20px;overflow:hidden;padding:18px 18px 6px;margin-bottom:14px;border:1px solid var(--line);text-align:center}

.p-hero .greet{font-size:23px;margin-top:2px}
.p-hero .aura{font-family:"Fraunces";font-style:italic;color:var(--golds);font-size:14px;margin-top:2px}

/* TRIANGLE */
.tri{position:relative;width:100%;max-width:300px;margin:16px auto 10px;aspect-ratio:1/1.08}
.tri svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);width:70px;height:70px}
.node .rg{width:70px;height:70px;border-radius:50%;position:relative;display:grid;place-items:center}
.node .rg::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c) calc(var(--pct)*360deg),#282838 0);-webkit-mask:radial-gradient(closest-side,transparent 70%,#000 71%);mask:radial-gradient(closest-side,transparent 70%,#000 71%)}
.node .core{position:absolute;inset:8px;border-radius:50%;background:var(--ink2);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 6px 18px -8px #000}
.node .core svg{width:26px;height:26px;display:block}
.node .nlab{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none}
.node.n-top .nlab{bottom:100%;margin-bottom:10px}
.node.n-bot .nlab{top:100%;margin-top:10px}
.node .lbl{font-family:"Bricolage Grotesque";font-weight:800;font-size:13.5px;letter-spacing:.02em}
.node .pc{font-family:"JetBrains Mono";font-size:11px;color:var(--mid);margin-top:1px}

.ph>*{position:relative;z-index:2}
.ph .em{font-size:30px}
.ph h2{font-size:26px;margin-top:4px}
.ph .sub{color:var(--mid);font-size:13.5px;margin-top:2px}

.task{display:flex;align-items:center;gap:12px;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;transition:.2s}
.task .box{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--dim);flex:none;display:grid;place-items:center;transition:.2s}

.task .lbl{font-size:15.5px;flex:1}

.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button.on{color:var(--gold)}
.nav button.on.mente{color:var(--mente)}
.nav button.on.cuerpo{color:var(--cuerpo)}
.nav button.on.alma{color:var(--alma)}

.sec-title{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-family:"JetBrains Mono";margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:16px;height:2px;border-radius:2px;background:currentColor;opacity:.5}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:22px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--line2);color:var(--tx);padding:11px 18px;border-radius:999px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 12px 40px -10px #000}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.modal.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--ink2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s ease;max-height:88vh;overflow:auto}

.field{margin-bottom:11px}
.field label{font-size:12px;color:var(--mid);display:block;margin-bottom:5px;font-family:"JetBrains Mono";letter-spacing:.03em}

.seg button.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
.switch{width:46px;height:27px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--mid);transition:.2s}
.switch.on{background:var(--gold)}
.switch.on::after{left:21px;background:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function load(){
  try{let r=localStorage.getItem(KEY);
    if(!r){const old=localStorage.getItem("alza_v1");if(old){const o=JSON.parse(old);const m=JSON.parse(JSON.stringify(DEFAULT));["profile","goals","foodDB","quotes","verses","videos","days"].forEach(k=>{if(o[k])m[k]=o[k];});return m;}}
    if(r){const p=JSON.parse(r);return Object.assign(JSON.parse(JSON.stringify(DEFAULT)),p,{ui:{tab:"panel"}});}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}

/* ============ HELPERS ============ */
function todayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayOfYear(d){d=d||new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);}
function getDay(k){k=k||todayKey();if(!S.days[k])S.days[k]={ritual:{},foods:[],rec:{},journal:"",intention:""};return S.days[k];}
function esc(s){return(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function pillarHabits(p){return S.habits.filter(h=>h.pillar===p);}
function pillarPct(p,k){const d=getDay(k);const hs=pillarHabits(p);if(!hs.length)return 0;return hs.filter(h=>d.ritual[h.id]).length/hs.length;}
function overallPct(k){const d=getDay(k);const n=S.habits.length||1;return S.habits.filter(h=>d.ritual[h.id]).length/n;}
function todayFoodTotals(){const d=getDay();return d.foods.reduce((a,f)=>{a.kc+=f.kc*f.q;a.p+=f.p*f.q;a.c+=f.c*f.q;a.f+=f.f*f.q;return a;},{kc:0,p:0,c:0,f:0});}
function aura(p){if(p<=0)return"Noche";if(p<.25)return"Noche";if(p<.5)return"Amanecer";if(p<.75)return"Aurora";if(p<1)return"Sol";return"Pleno oro";}
function streak(){let s=0;for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);if(!S.days[k]){if(i===0)continue;else break;}if(overallPct(k)>=.6)s++;else if(i>0)break;}return s;}
function greetWord(){const h=new Date().getHours();if(h<12)return"Buenos días";if(h<19)return"Buenas tardes";return"Buenas noches";}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1900);}
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#08080D" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
function ringStyle(pct,color,size){return `width:${size}px;height:${size}px;background:radial-gradient(closest-side,var(--ink) 74%,transparent 75%),conic-gradient(${color} ${(pct*360).toFixed(1)}deg,#26263a 0)`;}

   ["mente",pm,50,29,"n-top"],["cuerpo",pc,18,75,"n-bot"],["alma",pa,82,75,"n-bot"]
  ];
  const nodeHtml=nodes.map(([id,pct,x,y,cls])=>{const P=PILLARS[id];
    return `<div class="node ${cls}" style="left:${x}%;top:${y}%" onclick="go('${id}')">
      <div class="rg" style="--c:${P.color};--pct:${pct.toFixed(3)}"><span class="core" style="color:${P.color}">${ic(P.icon,26,1.9)}</span></div>

function momentumScore(){let s=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);s+=S.days[k]?overallPct(k):0;}return Math.round(s/7*100);}
function momentumChart(){
  let bars="";for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);
    const p=S.days[k]?overallPct(k):0;const lbl=d.toLocaleDateString('es-MX',{weekday:'short'}).slice(0,1).toUpperCase();
    bars+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:100%;height:66px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.max(4,p*100)}%;border-radius:5px 5px 0 0;background:${p>=.6?'linear-gradient(180deg,#FFC15E,#43D6A0)':'linear-gradient(180deg,#7B5CFF,#241B4D)'}"></div></div>
      <div class="mono" style="font-size:10px;color:var(--dim)">${lbl}</div></div>`;}
  return `<div class="row" style="margin-bottom:12px"><div><div class="eye">Score semanal</div><div style="font-family:'Bricolage Grotesque';font-weight:800;font-size:30px">${momentumScore()}<span style="font-size:15px;color:var(--dim)">/100</span></div></div>

/* ============ PILLAR PAGES ============ */
function vPillar(p){
  const P=PILLARS[p];const pct=pillarPct(p);
  let modules="";
  if(p==="mente"){modules=habitBlock(p)+quoteModule()+journalModule()+videoModule(p);}
  if(p==="cuerpo"){modules=habitBlock(p)+macrosModule()+recoveryModule()+videoModule(p);}
  if(p==="alma"){modules=habitBlock(p)+verseModule()+intentionModule()+videoModule(p);}
  return `
  <div class="ph" style="--p:${pct}">
    <div class="fill" style="background:linear-gradient(180deg,transparent,${P.color}22 60%,${P.color}44);opacity:${(0.4+pct*0.6).toFixed(2)}"></div>
    <div class="row" style="align-items:flex-start">
      <div><span class="phic" style="color:${P.color}">${ic(P.icon,30,1.8)}</span><h2 style="color:${P.color}">${P.name}</h2><div class="sub">${P.sub}</div></div>
      <div class="ring" style="${ringStyle(pct,P.color,72)}"><div class="in"><div class="big" style="font-size:20px">${Math.round(pct*100)}%</div></div></div>
    </div>
  </div>
  ${modules}<div style="height:10px"></div>`;
}
function habitBlock(p){
  const d=getDay();const P=PILLARS[p];const hs=pillarHabits(p);

  ${hs.map(h=>`<div class="task ${d.ritual[h.id]?'done':''}" onclick="toggleHabit('${h.id}')">
     <span class="box" style="${d.ritual[h.id]?`background:${P.color};border-color:${P.color}`:''}">${CHECK}</span>
     <span class="hic" style="color:${P.color}">${ic(h.icon,20)}</span><span class="lbl">${esc(h.lbl)}</span>
     <button class="del" onclick="event.stopPropagation();delHabit('${h.id}')">×</button></div>`).join("")}
  <button class="pillbtn ghost" style="width:100%;margin-top:2px" onclick="addHabitSheet('${p}')">+ Agregar hábito de ${P.name.toLowerCase()}</button>`;
}
function toggleHabit(id){const h=S.habits.find(x=>x.id===id);const d=getDay();d.ritual[id]=!d.ritual[id];const wasOv=overallPct();render();if(wasOv>=1)toast("Día en equilibrio 🔥");save();}
function delHabit(id){if(!confirm("¿Quitar este hábito?"))return;S.habits=S.habits.filter(h=>h.id!==id);render();}
function addHabitSheet(p){
  _hp=p;_hicon="star";

   <div class="field"><label>Área</label><div class="seg" id="hpil">${Object.keys(PILLARS).map(k=>`<button class="${k===p?'on':''}" data-p="${k}" onclick="pickHP(this)" style="${k===p?`background:${PILLARS[k].color};border-color:${PILLARS[k].color};color:#08080D`:''}">${PILLARS[k].name}</button>`).join("")}</div></div>

  const macro=(lbl,val,goal,col)=>`<div class="macrobar"><div class="r"><span>${lbl}</span><span class="tnum">${Math.round(val)} / ${goal}g</span></div><div class="bar"><i style="width:${Math.min(100,val/goal*100)}%;background:${col}"></i></div></div>`;

   ${S.foodDB.slice(0,14).map(f=>`<button class="chip" onclick="quickAdd(${S.foodDB.indexOf(f)})">${esc(f.n.replace(/\(.*\)/,'').trim())} · ${f.kc}</button>`).join("")}</div>
  <div class="card" style="margin-top:10px">
   ${d.foods.length?d.foods.map((f,i)=>`<div class="foodrow"><div class="nm">${esc(f.n)}${f.q>1?` <span class="mc">×${f.q}</span>`:""}<div class="mc">P ${Math.round(f.p*f.q)} · C ${Math.round(f.c*f.q)} · G ${Math.round(f.f*f.q)}</div></div><div class="kc tnum">${Math.round(f.kc*f.q)}</div><button class="del" onclick="delFood(${i})" style="color:var(--dim);font-size:20px;width:30px">×</button></div>`).join(""):`<div class="empty">Aún no registras comida hoy.</div>`}
  </div>`;
}
function quickAdd(i){const f=S.foodDB[i];getDay().foods.push({n:f.n,kc:f.kc,p:f.p,c:f.c,f:f.f,q:1});render();toast(f.n.replace(/\(.*\)/,'').trim()+" +");}
function delFood(i){getDay().foods.splice(i,1);render();}
function addFoodSheet(code){
  const known=code?S.foodDB.find(f=>f.bc===code):null;
  openSheet(`<h3>${code?"Producto escaneado":"Agregar comida"}</h3>
   ${code?`<div class="mono dim" style="font-size:11px;margin-bottom:10px">Código: ${esc(code)}${known?" · guardado ✓":" · nuevo"}</div>`:""}
   <div class="field"><label>Nombre</label><input id="fn" placeholder="Ej. Barra de proteína" value="${known?esc(known.n):""}"></div>
   <div class="g4">
     <div class="field"><label>Kcal</label><input id="fk" type="number" inputmode="numeric" value="${known?known.kc:""}"></div>
     <div class="field"><label>Prot</label><input id="fp" type="number" inputmode="numeric" value="${known?known.p:""}"></div>
     <div class="field"><label>Carb</label><input id="fc" type="number" inputmode="numeric" value="${known?known.c:""}"></div>
     <div class="field"><label>Grasa</label><input id="ff" type="number" inputmode="numeric" value="${known?known.f:""}"></div></div>
   <div class="field"><label>Porciones</label><input id="fq" type="number" inputmode="decimal" value="1"></div>
   <button class="pillbtn primary" style="width:100%" onclick="saveFood('${code||""}')">Agregar al día</button>
   <button class="pillbtn ghost" style="width:100%;margin-top:8px" onclick="saveFoodToDB('${code||""}')">Guardar en mis alimentos + agregar</button>`);
}
function readFood(){return{n:document.getElementById("fn").value.trim(),kc:+document.getElementById("fk").value||0,p:+document.getElementById("fp").value||0,c:+document.getElementById("fc").value||0,f:+document.getElementById("ff").value||0,q:+document.getElementById("fq").value||1};}
function saveFood(){const f=readFood();if(!f.n)return toast("Ponle nombre");getDay().foods.push(f);closeSheet();render();toast("Agregado");}
function saveFoodToDB(code){const f=readFood();if(!f.n)return toast("Ponle nombre");const e={n:f.n,kc:f.kc,p:f.p,c:f.c,f:f.f};if(code)e.bc=code;S.foodDB.unshift(e);getDay().foods.push(f);closeSheet();render();toast("Guardado");}
let scanStream,scanRAF;
async function startScan(){
  const el=document.getElementById("scan");el.classList.add("on");const vid=document.getElementById("scanvid");
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});vid.srcObject=scanStream;await vid.play();
    const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
    const tick=async()=>{if(!el.classList.contains("on"))return;try{const c=await det.detect(vid);if(c.length){const code=c[0].rawValue;stopScan();addFoodSheet(code);return;}}catch(e){}scanRAF=requestAnimationFrame(tick);};tick();
  }catch(e){stopScan();toast("No pude abrir la cámara aquí");}
}
function stopScan(){const el=document.getElementById("scan");el.classList.remove("on");if(scanRAF)cancelAnimationFrame(scanRAF);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}

/* ---- CUERPO: recovery ---- */
function recoveryModule(){
  const r=getDay().rec;
  const inp=(k,lbl)=>`<div class="field"><label>${lbl}</label><input type="number" inputmode="numeric" value="${r[k]!=null?r[k]:""}" onchange="setRec('${k}',this.value)" placeholder="—"></div>`;
  let spark="";for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);const rv=(S.days[k]&&S.days[k].rec.recovery)||0;spark+=`<div style="flex:1;height:${Math.max(4,rv)}%;border-radius:3px 3px 0 0;background:${rv>=66?'var(--green)':rv>=34?'var(--gold)':'var(--coral)'};min-height:4px"></div>`;}
  return `<div class="sec-title" style="color:var(--cuerpo)">Recovery · WHOOP</div>
  <div class="card">
    <div class="row"><div class="ring" style="${ringStyle((r.recovery||0)/100,'var(--green)',104)}"><div class="in"><div class="big tnum" style="font-size:24px;color:var(--green)">${r.recovery!=null?r.recovery+'%':'—'}</div><div class="mono" style="font-size:9px;color:var(--mid)">RECOVERY</div></div></div>
    <div style="flex:1;margin-left:14px"><div class="mono dim" style="font-size:11px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em">Semana</div><div style="display:flex;gap:5px;align-items:flex-end;height:54px">${spark}</div></div></div>
    <div class="g2" style="margin-top:14px">${inp("recovery","Recovery %")}${inp("strain","Strain")}</div>
    <div class="g2">${inp("sleep","Sueño (h)")}${inp("cal","Calorías")}</div>
    <div class="g2">${inp("hrv","HRV (ms)")}${inp("steps","Pasos")}</div>
  </div>
  <div class="card tight" style="display:flex;gap:11px;align-items:center"><div style="color:var(--cuerpo);display:inline-flex;flex:none">${ic('watch',22)}</div><div class="dim" style="font-size:12.5px">Hoy los capturas a mano. En la versión instalada, se conecta a <b style="color:var(--cuerpo)">WHOOP</b> y se llena solo.</div></div>`;
}
function setRec(k,v){getDay().rec[k]=v===""?null:+v;save();if(k==="recovery")render();}

/* ---- videos (por pilar) ---- */
function videoModule(p){
  const P=PILLARS[p];const list=S.videos.filter(v=>P.cats.includes(v.cat));
  return `<div class="sec-title" style="color:${P.color}">Videos · ${P.name}</div>
   ${list.length?list.map(v=>vidRow(v,S.videos.indexOf(v))).join(""):`<div class="empty" style="padding:16px">Sin videos aún en esta área.</div>`}
   <button class="pillbtn ghost" style="width:100%;margin-top:2px" onclick="addVideoSheet('${p}')">+ Agregar video</button>`;
}
function vidRow(v,i){return `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener">
  <div class="thumb"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M10 8l6 4-6 4z"/></svg></div>
  <div style="flex:1"><div class="cat">${esc(v.cat)}</div><div class="t">${esc(v.title)}</div></div>
  <button class="del" onclick="event.preventDefault();event.stopPropagation();delVideo(${i})" style="color:var(--dim);font-size:20px;width:30px">×</button></a>`;}
function addVideoSheet(p){
  const cats=PILLARS[p].cats;_vcat=cats[0];
  openSheet(`<h3>Nuevo video</h3>
   <div class="field"><label>Título</label><input id="vt" placeholder="Ej. Tony Robbins - Hazlo ya"></div>
   <div class="field"><label>Link de YouTube</label><input id="vu" placeholder="https://youtube.com/..." inputmode="url"></div>
   <div class="field"><label>Categoría</label><div class="seg" id="vcat">${cats.map((c,i)=>`<button onclick="pickVCat(this)" class="${i===0?'on':''}">${c}</button>`).join("")}</div></div>
   <button class="pillbtn primary" style="width:100%" onclick="saveVideo()">Guardar</button>`);
}
let _vcat="Mentalidad";
function pickVCat(b){document.querySelectorAll("#vcat button").forEach(x=>x.classList.remove("on"));b.classList.add("on");_vcat=b.textContent;}
function saveVideo(){const t=document.getElementById("vt").value.trim();const u=document.getElementById("vu").value.trim();if(!t||!u)return toast("Falta título o link");S.videos.push({title:t,url:u,cat:_vcat});closeSheet();render();toast("Video guardado");}
function delVideo(i){S.videos.splice(i,1);render();}

/* ============ SETTINGS ============ */
function openSettings(){
  const pr=S.profile;const g=S.goals;
  openSheet(`<h3>Ajustes</h3>
   <div class="field"><label>Tu nombre</label><input id="sn" value="${esc(pr.name)}"></div>
   <div class="field"><label>Hora de despertar</label><input id="sw" type="time" value="${pr.wake}"></div>
   <div class="row card tight" style="margin-bottom:11px"><div><div style="font-size:14px">Verso bíblico</div><div class="dim" style="font-size:12px">Mostrarlo en el Panel</div></div>
     <div class="switch ${pr.showVerse?'on':''}" onclick="this.classList.toggle('on');S.profile.showVerse=this.classList.contains('on');save()"></div></div>
   <div class="sec-title">Metas diarias de macros</div>
   <div class="g4"><div class="field"><label>Kcal</label><input id="gk" type="number" value="${g.kcal}"></div>
     <div class="field"><label>Prot</label><input id="gp" type="number" value="${g.p}"></div>
     <div class="field"><label>Carb</label><input id="gc" type="number" value="${g.c}"></div>
     <div class="field"><label>Grasa</label><input id="gf" type="number" value="${g.f}"></div></div>
   <button class="pillbtn primary" style="width:100%;margin-top:4px" onclick="saveSettings()">Guardar cambios</button>
   <div class="sec-title" style="margin-top:20px">Tus datos</div>
   <button class="pillbtn ghost" style="width:100%;margin-bottom:8px" onclick="exportData()">⬇︎ Exportar respaldo (.json)</button>
   <label class="pillbtn ghost" style="width:100%;display:flex">⬆︎ Importar respaldo<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label>
   <div class="dim mono" style="font-size:10.5px;margin-top:10px;line-height:1.6">Tus frases y versos son editables — revisa que las atribuciones te cuadren. Todo se guarda en este dispositivo; usa "Exportar" para respaldar o mover tus datos. v0.2 · Mente·Cuerpo·Alma</div>`);
}
function saveSettings(){S.profile.name=document.getElementById("sn").value.trim()||"Juan";S.profile.wake=document.getElementById("sw").value||"05:30";
  S.goals.kcal=+document.getElementById("gk").value||2200;S.goals.p=+document.getElementById("gp").value||175;S.goals.c=+document.getElementById("gc").value||230;S.goals.f=+document.getElementById("gf").value||70;
  closeSheet();render();toast("Guardado");}
async function exportData(){const data=JSON.stringify(S,null,2);
  const dl=(typeof claude!=="undefined"&&claude&&claude.use)?await claude.use("downloads").catch(()=>null):null;
  if(dl){try{await dl.save({filename:"alza-respaldo-"+todayKey()+".json",data});toast("Respaldo listo");return;}catch(e){if(e&&e.code==="declined")return;}}
  try{const b=new Blob([data],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="alza-respaldo.json";a.click();}catch(e){toast("No pude exportar aquí");}}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),o,{ui:{tab:"panel"}});save();closeSheet();render();toast("Datos importados");}catch(e){toast("Archivo no válido");}};r.readAsText(f);}

/* ============ SHEET ============ */
function openSheet(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("on");}
function closeSheet(){document.getElementById("modal").classList.remove("on");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet();});

render();

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
