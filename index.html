<title>ALZA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALZA">
<meta name="description" content="Tu sistema diario: Mente, Cuerpo y Alma.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#08080D;--ink2:#0E0E16;--surface:#15151F;--surface2:#1C1C2A;
  --glass:rgba(28,28,42,.55);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --tx:#F5F6FA;--mid:#C6C9D2;--dim:#8C90A0;
  --gold:#FFC15E;--golds:#F2C57C;--amber:#F2954B;--magenta:#C2447E;--indigo:#5B49C9;
  --green:#43D6A0;--coral:#FF6B6B;--teal:#2FD1C6;
  --mente:#7B5CFF;--cuerpo:#43D6A0;--alma:#FFC15E;
  --sunh:linear-gradient(90deg,#7B5CFF,#43D6A0,#FFC15E);
  --warm:linear-gradient(180deg,#FFCE7A,#F2954B);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--tx);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.mono{font-family:"JetBrains Mono",monospace}
.serif{font-family:"Fraunces",serif}
.tnum{font-variant-numeric:tabular-nums}
.dim{color:var(--mid)}
.eye{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:96px}
.view{padding:14px 16px 8px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;background:linear-gradient(180deg,var(--ink) 70%,transparent);backdrop-filter:blur(6px)}
.brand{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;letter-spacing:.02em;background:var(--sunh);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mid);background:var(--surface)}

.card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--surface),var(--ink2));padding:16px;margin-bottom:12px}
.card.tight{padding:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pillbtn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px}
.primary{background:linear-gradient(90deg,var(--gold),var(--amber));color:var(--ink);box-shadow:0 10px 26px -12px var(--amber)}
.ghost{border:1px solid var(--line2);color:var(--tx);background:var(--surface)}
.chip{font-family:"JetBrains Mono",monospace;font-size:12px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mid);background:var(--surface);white-space:nowrap}

.quote{position:relative;border:1px solid var(--line);border-radius:18px;padding:22px 20px;background:linear-gradient(180deg,rgba(123,92,255,.12),rgba(18,18,28,.6));box-shadow:0 24px 50px -34px var(--mente),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(8px)}
.quote::before{content:"\201C";position:absolute;top:2px;left:14px;font-family:"Fraunces";font-size:58px;color:var(--mente);opacity:.28;line-height:1}
.quote .q{font-family:"Fraunces";font-style:italic;font-size:20px;line-height:1.42;color:#EFEBFF;position:relative}
.quote .att{font-family:"JetBrains Mono";font-size:11px;color:#B9A9FF;margin-top:12px;letter-spacing:.05em}
.verse{position:relative;border:1px solid rgba(255,193,94,.22);border-radius:18px;padding:22px 20px;background:linear-gradient(180deg,rgba(255,193,94,.11),rgba(18,18,28,.6));box-shadow:0 24px 50px -34px var(--gold),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(8px)}
.verse::before{content:"\271D";position:absolute;top:16px;right:18px;font-size:20px;color:var(--gold);opacity:.4}
.verse .q{font-family:"Fraunces";font-style:italic;font-size:18px;line-height:1.42;color:#FBEBD3}
.verse b{color:var(--golds);font-family:"JetBrains Mono";font-size:11px;display:block;margin-top:10px;letter-spacing:.04em;font-weight:400}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--surface)}
.mini .k{font-size:11px}
.mini .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;margin-top:3px}
.mini .v small{font-size:12px;color:var(--dim);font-weight:600}

.ring{border-radius:50%;display:grid;place-items:center;flex:none}
.ring .in{text-align:center}
.ring .big{font-family:"Bricolage Grotesque";font-weight:800;line-height:1}

/* PANEL HERO */
.p-hero{position:relative;border-radius:24px;overflow:hidden;padding:20px 18px 18px;margin-bottom:14px;border:1px solid var(--line);text-align:center;background:linear-gradient(180deg,#0C0C15,#08080D 62%);box-shadow:0 34px 70px -48px #000,inset 0 1px 0 rgba(255,255,255,.04)}
.p-hero .aurora{position:absolute;inset:-2px;z-index:0;background:radial-gradient(60% 42% at 50% 4%,rgba(123,92,255,.28),transparent 60%),radial-gradient(52% 40% at 14% 96%,rgba(67,214,160,.22),transparent 62%),radial-gradient(52% 40% at 86% 96%,rgba(255,193,94,.26),transparent 62%);animation:breathe 9s ease-in-out infinite}
.p-hero .aurora.b{filter:blur(9px);opacity:.5;animation-duration:13s;animation-direction:alternate-reverse}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.78}50%{transform:scale(1.07);opacity:1}}
.p-hero .grain{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 42%,transparent 58%,rgba(0,0,0,.5) 100%)}
.p-hero>*{position:relative;z-index:2}
.p-hero .greet{font-size:25px;margin-top:6px}
.p-hero .greet .sun{display:inline-flex;vertical-align:-4px;margin-left:3px;color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,193,94,.5))}
.p-hero .sub{font-family:"Fraunces";font-style:italic;color:var(--golds);font-size:15px;margin-top:4px;opacity:.92}

/* EDITORIAL GREETING BAND (v2 · estilo carta) */
.greetband{position:relative;border-radius:20px;overflow:hidden;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line);background:linear-gradient(180deg,#141019,#0A0A10 72%);box-shadow:0 24px 50px -44px #000,inset 0 1px 0 rgba(255,255,255,.05)}
.greetband .warmglow{position:absolute;inset:0;z-index:0;background:radial-gradient(90% 62% at 50% -14%,rgba(255,193,94,.34),rgba(242,149,75,.12) 40%,transparent 66%);animation:breathe 10s ease-in-out infinite}
.greetband .warmglow.b{background:radial-gradient(70% 46% at 78% 0%,rgba(194,68,126,.20),transparent 60%);animation-duration:14s;animation-direction:alternate-reverse;filter:blur(4px)}
.greetband>*{position:relative;z-index:2}
.greetband .ghead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.greetband .day{font-family:"JetBrains Mono";font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--golds);opacity:.82}
.greetband .hi{font-family:"Fraunces";font-weight:500;font-size:23px;line-height:1.12;letter-spacing:-.01em;color:#FBF3E7;margin-top:4px;white-space:nowrap}
.greetband .hi .nm{font-style:italic;color:var(--gold)}
.greetband .hi .sun{display:inline-flex;vertical-align:-4px;margin-left:3px;color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,193,94,.55))}
.greetband .wakemini{text-align:right;flex:none;line-height:1.05}
.greetband .wakemini .wk{display:block;font-family:"JetBrains Mono";font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.greetband .wakemini .wv{font-family:"Bricolage Grotesque";font-weight:800;font-size:17px;color:#FBF3E7}
.greetband .wakemini .wv small{font-size:10px;color:var(--dim);font-weight:600;margin-left:2px}

/* STAGE (triangulo Mente/Cuerpo/Alma) */
.stage{position:relative;width:100%;max-width:352px;margin:8px auto 2px}
.stage svg{display:block;width:100%;height:auto;overflow:visible}
.tri-fill{transition:opacity 1.2s ease}
.stage .track{fill:none;stroke:#20202f;stroke-width:6}
.stage .pr{fill:none;stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transform-box:fill-box;transition:stroke-dashoffset 1.25s cubic-bezier(.22,.9,.24,1)}
.stage .disc{fill:var(--ink2);stroke:rgba(255,255,255,.06)}
.stage .halo{opacity:0;transform-origin:center;transform-box:fill-box}
.stage .halo.on{animation:halo 2.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:0;transform:scale(.92)}50%{opacity:.5;transform:scale(1.12)}}
.stage .core-num{font-family:"Bricolage Grotesque";font-weight:800;fill:#fff;text-anchor:middle;letter-spacing:-.02em}
.stage .core-cap{font-family:"JetBrains Mono";font-size:9px;letter-spacing:.22em;text-anchor:middle}
.stage .flow{fill:none;stroke:url(#edge);stroke-width:2;stroke-linecap:round;stroke-dasharray:5 12;opacity:.9;animation:flowe 2.6s linear infinite}
@keyframes flowe{to{stroke-dashoffset:-102}}
.stage .spin{transform-box:fill-box;transform-origin:center;animation:spinh 15s linear infinite}
@keyframes spinh{to{transform:rotate(360deg)}}
.stage .flare{opacity:0;transform-box:fill-box;transform-origin:center}
.stage .flare.on{animation:flarep 2.4s ease-out infinite}
@keyframes flarep{0%{opacity:0;transform:scale(.5)}22%{opacity:.5}100%{opacity:0;transform:scale(1.75)}}
.p-hero .embers{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.p-hero .ember{position:absolute;bottom:6%;width:5px;height:5px;border-radius:50%;filter:blur(.6px);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}14%{opacity:.6}82%{opacity:.26}100%{transform:translateY(-300px) scale(1);opacity:0}}
.stage .n-lab{font-family:"Bricolage Grotesque";font-weight:800;text-anchor:middle;letter-spacing:.01em}
.stage .n-pct{font-family:"JetBrains Mono";font-weight:500;text-anchor:middle;fill:var(--mid)}

/* stat chips dentro del hero */
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.hstat{border:1px solid var(--line);border-radius:14px;padding:11px 5px 10px;background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;gap:3px}
.hstat.tap{cursor:pointer}
.hstat .sk{font-family:"JetBrains Mono";font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.hstat .sv{font-family:"Bricolage Grotesque";font-weight:800;font-size:19px;line-height:1}
.hstat .sv small{font-size:10px;color:var(--dim);font-weight:600}

/* pillar hero (sub pages) */
.ph{position:relative;border-radius:22px;overflow:hidden;padding:20px 18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 26px 54px -42px #000,inset 0 1px 0 rgba(255,255,255,.05)}
.ph .fill{position:absolute;inset:0;transition:opacity 1.1s;mask-image:linear-gradient(0deg,#000,#000 calc(var(--p,0)*100%),transparent calc(var(--p,0)*100% + 5%));-webkit-mask-image:linear-gradient(0deg,#000,#000 calc(var(--p,0)*100%),transparent calc(var(--p,0)*100% + 5%))}
.ph>*{position:relative;z-index:2}
.ph .em{font-size:30px}
.ph h2{font-size:26px;margin-top:4px}
.ph .sub{color:var(--mid);font-size:13.5px;margin-top:2px}

.task{display:flex;align-items:center;gap:12px;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;transition:.2s}
.task .box{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--dim);flex:none;display:grid;place-items:center;transition:.2s}
.task .box svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:.2s}
.task .lbl{font-size:15.5px;flex:1}
.task .em{font-size:18px}
.task.done .box svg{opacity:1;transform:scale(1)}
.task.done{border-color:var(--line2)}
.task .del{color:var(--dim);font-size:18px;width:30px;text-align:center;opacity:.6}
.ic{display:block}
.hic{display:inline-flex;align-items:center;justify-content:center;width:24px;flex:none}
.hic svg{width:20px;height:20px}
.nic,.phic{display:inline-flex}
.phic{margin-bottom:3px}
.phic svg{width:30px;height:30px}
.nav button .ic{margin-bottom:1px}
.iconpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.iconpick button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--mid);display:grid;place-items:center}
.iconpick button.on{border-color:var(--gold);color:var(--gold);background:rgba(255,193,94,.1)}

.macrobar{margin-bottom:10px}
.macrobar .r{display:flex;justify-content:space-between;font-family:"JetBrains Mono";font-size:12px;color:var(--mid);margin-bottom:5px}
.bar{height:8px;border-radius:99px;background:#232333;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
.foodrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.foodrow .nm{flex:1;font-size:15px}
.foodrow .mc{font-family:"JetBrains Mono";font-size:11px;color:var(--dim)}
.foodrow .kc{font-family:"Bricolage Grotesque";font-weight:800;font-size:15px}
/* Nutrición estilo diario */
.rem{display:flex;align-items:center;justify-content:space-between;gap:14px}
.rem .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em;text-shadow:0 0 26px currentColor}
.rem .lab{font-family:"JetBrains Mono";font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.krow{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-family:"JetBrains Mono";font-size:11px}
.krow .c{flex:1;text-align:center}.krow .c .n{font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;color:var(--tx)}.krow .c .k{color:var(--dim);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.krow .op{color:var(--dim);align-self:center;font-size:16px}
.mmini{display:flex;gap:8px;margin-top:14px}
.mmini .m{flex:1;text-align:center}
.mmini .m .ring{margin:0 auto 5px}
.mmini .m .g{font-family:"JetBrains Mono";font-size:11px;color:var(--mid)}
.mmini .m .t{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.mealhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 2px;padding:0 2px}
.mealhead .nm{font-family:"Bricolage Grotesque";font-weight:800;font-size:16px}
.mealhead .kc{font-family:"JetBrains Mono";font-size:12px;color:var(--mid)}
.addfood{width:100%;margin-top:8px;border:1px dashed var(--line2);border-radius:12px;padding:11px;color:var(--cuerpo);background:rgba(67,214,160,.05);font-family:"JetBrains Mono";font-size:12.5px;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:7px}
.addfood:active{transform:scale(.99)}
.foodrow.tap{cursor:pointer}
.foodrow .meal-empty{color:var(--dim);font-size:13px;padding:9px 0;border-top:1px solid var(--line)}
/* InBody · composición */
.inbody{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ibx{border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,var(--surface),var(--ink2));padding:10px 4px 9px;text-align:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ibx:active{transform:scale(.98)}
.ibx .ibl{font-size:9.5px;color:var(--mid);font-weight:600;line-height:1.12;min-height:24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ibx .ibl small{color:var(--dim);font-weight:600;font-size:8.5px}
.ibx .ibv{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1;margin:4px 0 7px;color:var(--tx)}
.ibx .ibv small{font-size:12px;color:var(--dim);font-weight:800}
.ibx .ibd{display:inline-flex;align-items:center;gap:2px;font-family:"JetBrains Mono";font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:999px;letter-spacing:.01em}
.ibx .ibd.good{background:#2FB985;color:#04271A}
.ibx .ibd.bad{background:#E5586B;color:#fff}
.ibx .ibd.same{background:var(--surface2);color:var(--mid);border:1px solid var(--line)}
.ibx .ibp{font-size:8.5px;color:var(--dim);margin-top:5px;font-family:"JetBrains Mono";letter-spacing:.02em}
.scanwrap{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.scanwrap.on{display:flex}
.scanwrap video{width:100%;height:100%;object-fit:cover}
.scanwrap .close{position:absolute;top:16px;right:16px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid var(--line2);font-size:20px}
.scanwrap .hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:#fff;font-family:"JetBrains Mono";font-size:12px}
.scanwrap .frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:75%;height:120px;border:2px solid var(--gold);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}

.vid{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--surface);margin-bottom:9px;text-decoration:none;color:inherit;cursor:pointer}
.vid .thumb{width:64px;height:42px;border-radius:8px;background:linear-gradient(135deg,#7A2E6E,#241B4D) center/cover no-repeat;display:grid;place-items:center;flex:none;color:#fff;position:relative;overflow:hidden}
.vid .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .thumb .play{position:relative;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.vid .t{flex:1;font-size:14.5px;font-weight:500}
.vid .cat{font-family:"JetBrains Mono";font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.vplayer{position:fixed;inset:0;z-index:130;display:none;flex-direction:column;background:rgba(0,0,0,.94);padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.vplayer.on{display:flex}
.vplayer .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.vplayer .bar .vt{font-size:15px;font-weight:600;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vplayer .bar .close{color:#fff;font-size:24px;width:38px;height:38px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1);border-radius:50%}
.vplayer .frame16{position:relative;width:100%;max-width:860px;margin:auto;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.vplayer .frame16 iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplayer .yt{display:block;text-align:center;margin-top:14px;color:var(--dim);font-family:"JetBrains Mono";font-size:11px;text-decoration:underline}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;justify-content:space-around;padding:9px 6px calc(9px + env(safe-area-inset-bottom));background:rgba(10,10,16,.86);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:40}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10px;font-family:"JetBrains Mono";letter-spacing:.03em;padding:4px 8px;flex:1;opacity:.62;transition:opacity .2s}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button.panel{color:var(--tx)}

function stage(){
  const D={mente:pillarPct("mente"),cuerpo:pillarPct("cuerpo"),alma:pillarPct("alma")};
  const ov=Math.round(overallPct()*100);
  const NODES={mente:{cx:180,cy:72},cuerpo:{cx:76,cy:240},alma:{cx:284,cy:240}};
  const R=32,C=2*Math.PI*R;
  const top=Object.keys(D).reduce((a,b)=>D[a]>=D[b]?a:b);
  let nodes="";
  for(const k in NODES){const P=PILLARS[k];const n=NODES[k];const pct=D[k];const isTop=n.cy<150;
    const off=(C*(1-pct)).toFixed(2);
    const labY=isTop?n.cy-52:n.cy+58, pctY=isTop?n.cy-37:n.cy+73;
    nodes+=`<g>
      <circle class="halo${(pct>=0.999||k===top)?' on':''}" cx="${n.cx}" cy="${n.cy}" r="30" fill="${P.color}" filter="url(#soft)"/>
      <circle class="track" cx="${n.cx}" cy="${n.cy}" r="${R}"/>
      <circle class="pr" data-off="${off}" cx="${n.cx}" cy="${n.cy}" r="${R}" stroke="${P.color}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/>
      <circle class="disc" cx="${n.cx}" cy="${n.cy}" r="${R-7}"/>
      <g transform="translate(${n.cx-13},${n.cy-13}) scale(1.08)" fill="none" stroke="${P.color}" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px ${P.color}66)">${ICONS[P.icon]}</g>
      <text class="n-lab" x="${n.cx}" y="${labY}" font-size="14" fill="${P.color}" onclick="go('${k}')" style="cursor:pointer">${P.name.toUpperCase()}</text>
      <text class="n-pct" data-pct="${Math.round(pct*100)}" x="${n.cx}" y="${pctY}" font-size="12">0%</text>
    </g>`;
  }
  const triOp=(0.42+overallPct()*0.5).toFixed(2);
  return `<div class="stage">
   <svg viewBox="0 0 360 300" onclick="if(!event.target.closest('[onclick*=go]'))animatePanel()">
    <defs>
     <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B5CFF"/><stop offset=".5" stop-color="#43D6A0"/><stop offset="1" stop-color="#FFC15E"/></linearGradient>
     <radialGradient id="triG" cx="50%" cy="60%" r="65%"><stop offset="0" stop-color="#FFC15E" stop-opacity=".22"/><stop offset=".55" stop-color="#43D6A0" stop-opacity=".12"/><stop offset="1" stop-color="#7B5CFF" stop-opacity=".06"/></radialGradient>
     <radialGradient id="coreG" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#1A1A28"/><stop offset="1" stop-color="#0B0B12"/></radialGradient>
     <radialGradient id="flareG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFC15E" stop-opacity=".5"/><stop offset="70%" stop-color="#FFC15E" stop-opacity=".12"/><stop offset="100%" stop-color="#FFC15E" stop-opacity="0"/></radialGradient>
     <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
     <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
    </defs>
    <circle id="triFlare" class="flare" cx="180" cy="182" r="70" fill="url(#flareG)"/>
    <polygon id="triFill" class="tri-fill" data-op="${triOp}" points="180,74 76,240 284,240" fill="url(#triG)" opacity="0"/>
    <polygon points="180,74 76,240 284,240" fill="none" stroke="url(#edge)" stroke-width="1.2" stroke-dasharray="3 7" stroke-linejoin="round" opacity=".28"/>
    <polygon class="flow" points="180,74 76,240 284,240"/>
    <g class="spin"><circle cx="180" cy="182" r="58" fill="none" stroke="url(#edge)" stroke-width="2.4" stroke-dasharray="72 250" stroke-opacity=".5" filter="url(#soft2)"/></g>
    <circle cx="180" cy="182" r="47" fill="url(#coreG)" stroke="rgba(255,255,255,.08)"/>
    <circle cx="180" cy="182" r="47" fill="none" stroke="url(#edge)" stroke-opacity=".28" stroke-width="1.2"/>
    <text id="coreNum" class="core-num" data-ov="${ov}" x="180" y="186" font-size="40">0<tspan font-size="18" dy="-14">%</tspan></text>
    <text class="core-cap" x="180" y="208" fill="#FFC15E">${aura(overallPct()).toUpperCase()}</text>
    ${nodes}
   </svg>
  </div>`;
}
function animatePanel(){
  const svg=document.querySelector(".stage svg");if(!svg)return;
  svg.querySelectorAll(".pr").forEach(el=>el.style.strokeDashoffset=el.getAttribute("stroke-dasharray"));
  requestAnimationFrame(()=>{
    svg.querySelectorAll(".pr").forEach((el,i)=>{const off=el.dataset.off;setTimeout(()=>el.style.strokeDashoffset=off,120+i*140);});
  });
  const tf=document.getElementById("triFill");if(tf){tf.style.opacity=0;requestAnimationFrame(()=>{setTimeout(()=>tf.style.opacity=tf.dataset.op,220);});}
  svg.querySelectorAll("[data-pct]").forEach((el,i)=>{setTimeout(()=>cUp(el,+el.dataset.pct,900,v=>v+"%"),180+i*140);});
  const cn=document.getElementById("coreNum");if(cn){const ov=+cn.dataset.ov;setTimeout(()=>cCore(cn,ov,1200),240);
    const fl=document.getElementById("triFlare");if(fl){fl.classList.remove("on");if(ov>=100)setTimeout(()=>fl.classList.add("on"),1200);}}
  const eb=document.getElementById("embers");if(eb&&!eb.childElementCount){const cols=["#7B5CFF","#43D6A0","#FFC15E"];let h="";for(let i=0;i<9;i++){const l=(6+Math.random()*88).toFixed(1);const c=cols[i%3];const du=(6+Math.random()*7).toFixed(1);const dl=(-Math.random()*10).toFixed(1);h+=`<span class="ember" style="left:${l}%;background:${c};box-shadow:0 0 7px ${c};animation-duration:${du}s;animation-delay:${dl}s"></span>`;}eb.innerHTML=h;}
  document.querySelectorAll(".hstat [data-count]").forEach((el,i)=>{setTimeout(()=>cUp(el,+el.dataset.count,900,v=>v.toLocaleString('es-MX')),320+i*80);});
}
function cUp(el,to,dur,fmt){fmt=fmt||(v=>v);to=to||0;const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(e*to));if(p<1)requestAnimationFrame(s);})(t0);}
function cCore(el,to,dur){const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);el.innerHTML=Math.round(e*to)+'<tspan font-size="18" dy="-14">%</tspan>';if(p<1)requestAnimationFrame(s);})(t0);}
function momentumScore(){let s=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);s+=S.days[k]?overallPct(k):0;}return Math.round(s/7*100);}
function momentumChart(){

      <div class="mono" style="font-size:10px;color:var(--dim)">${lbl}</div></div>`;}
  return `<div class="row" style="margin-bottom:12px"><div><div class="eye">Score semanal</div><div style="font-family:'Bricolage Grotesque';font-weight:800;font-size:30px">${momentumScore()}<span style="font-size:15px;color:var(--dim)">/100</span></div></div>

    <div style="display:flex;gap:6px;align-items:flex-end">${bars}</div>`;
}

const MEALS=[["des","Desayuno"],["com","Comida"],["cen","Cena"],["snk","Snacks"]];

function macrosModule(){
  const t=todayFoodTotals();const g=S.goals;const d=getDay();

/* ---- Open Food Facts: banco de comida + lookup por barcode ---- */
function r1(x){return Math.round(x*10)/10;}
let _offList=[],_offSel=0,_offT;
function offItem(p){const n=p.nutriments||{};let kc=n['energy-kcal_100g'];if(kc==null)kc=n['energy-kcal_value'];if(kc==null&&n['energy-kcal_serving']!=null)kc=n['energy-kcal_serving'];const name=(p.product_name||p.product_name_es||'').trim();if(!name||kc==null||isNaN(+kc))return null;const brand=p.brands?(' · '+String(p.brands).split(',')[0].trim()):'';return{n:name+brand,kc:+kc,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,code:p.code||''};}
function searchFoodSheet(){
  _offList=[];
  openSheet(`<h3>Banco de comida</h3>
   <div class="field"><input id="foodq" placeholder="Ej. yogur griego, avena, atún..." autocomplete="off" oninput="offSearchDeb(this.value)"></div>
   <div id="offhint" class="mono dim" style="font-size:11px;margin-bottom:10px">Escribe para buscar en Open Food Facts — millones de productos, gratis.</div>
   <div id="offres"></div>`);
  setTimeout(()=>{const e=document.getElementById('foodq');if(e)e.focus();},120);
}
function offSearchDeb(q){clearTimeout(_offT);_offT=setTimeout(()=>offSearch(q),450);}
async function offSearch(q){
  q=(q||'').trim();const res=document.getElementById('offres');const hint=document.getElementById('offhint');if(!res)return;
  if(q.length<2){res.innerHTML='';hint.textContent='Escribe al menos 2 letras…';return;}
  hint.textContent='Buscando…';
  try{
    const url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=24&fields=product_name,product_name_es,brands,nutriments,code&lc=es';
    const r=await fetch(url);const d=await r.json();
    _offList=(d.products||[]).map(offItem).filter(Boolean);
    if(!_offList.length){hint.textContent='Sin resultados. Prueba otro nombre o usa "+ Manual".';res.innerHTML='';return;}
    hint.textContent=_offList.length+' resultados';
    res.innerHTML=_offList.map((f,i)=>`<div class="foodrow" style="cursor:pointer;border-top:1px solid var(--line)" onclick="offPick(${i})"><div class="nm">${esc(f.n)}<div class="mc">por 100g · P ${r1(f.p)} · C ${r1(f.c)} · G ${r1(f.f)}</div></div><div class="kc tnum">${Math.round(f.kc)}</div></div>`).join('');
  }catch(e){hint.textContent='No pude buscar (revisa tu conexión). Usa "+ Manual".';res.innerHTML='';}
}
function offPick(i){_offSel=i;const f=_offList[i];if(!f)return;
  openSheet(`<h3>${esc(f.n)}</h3>
   <div class="mono dim" style="font-size:11px;margin-bottom:10px">Por 100 g: ${Math.round(f.kc)} kcal · P ${r1(f.p)} · C ${r1(f.c)} · G ${r1(f.f)}</div>
   <div class="field"><label>¿Cuántos gramos?</label><input id="offg" type="number" inputmode="decimal" value="100" oninput="offCalc()"></div>
   <div class="seg" style="margin-bottom:12px">${[50,100,150,200].map(x=>`<button onclick="document.getElementById('offg').value=${x};offCalc()">${x} g</button>`).join('')}</div>
   <div class="card tight" id="offcalc"></div>
   <button class="pillbtn primary" style="width:100%;margin-top:4px" onclick="offAdd()">Agregar al día</button>`);
  offCalc();
}
function offCalc(){const f=_offList[_offSel];if(!f)return;const g=+document.getElementById('offg').value||0;const m=g/100;const el=document.getElementById('offcalc');if(el)el.innerHTML=`<div class="row"><span class="dim" style="font-size:13px">${g} g</span><span style="font-family:'Bricolage Grotesque';font-weight:800;font-size:20px">${Math.round(f.kc*m)} kcal</span></div><div class="mono dim" style="font-size:12px;margin-top:5px">Proteína ${r1(f.p*m)}g · Carbos ${r1(f.c*m)}g · Grasas ${r1(f.f*m)}g</div>`;}
function offAdd(){const f=_offList[_offSel];if(!f)return;const g=+document.getElementById('offg').value||100;const m=g/100;
  getDay().foods.push({n:f.n+' ('+g+'g)',kc:f.kc*m,p:f.p*m,c:f.c*m,f:f.f*m,q:1,m:_meal});
  if(f.code&&!S.foodDB.find(x=>x.bc===f.code))S.foodDB.unshift({n:f.n,kc:f.kc,p:f.p,c:f.c,f:f.f,bc:f.code});
  closeSheet();render();toast("Agregado a "+mealName(_meal));}
async function lookupBarcode(code){
  const known=S.foodDB.find(f=>f.bc===code);if(known){addFoodSheet(code);return;}
  toast("Buscando producto…");
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'?fields=product_name,product_name_es,brands,nutriments,code');
    const d=await r.json();
    if(d&&d.status===1&&d.product){const it=offItem(Object.assign({},d.product,{code:code}));if(it){_offList=[it];offPick(0);return;}}
  }catch(e){}
  addFoodSheet(code);
}
let scanStream,scanRAF,_zxing,_zxload;
function loadZXing(){
  if(window.ZXing)return Promise.resolve();
  if(_zxload)return _zxload;
  _zxload=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";s.onload=()=>res();s.onerror=()=>rej(new Error("zxing"));document.head.appendChild(s);});
  return _zxload;
}
async function startScan(){
  const el=document.getElementById("scan");el.classList.add("on");const vid=document.getElementById("scanvid");
  // Native path (Chrome/Android): BarcodeDetector
  if("BarcodeDetector" in window){
    try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});vid.setAttribute("playsinline","");vid.srcObject=scanStream;await vid.play();
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
      const tick=async()=>{if(!el.classList.contains("on"))return;try{const c=await det.detect(vid);if(c.length){const code=c[0].rawValue;stopScan();lookupBarcode(code);return;}}catch(e){}scanRAF=requestAnimationFrame(tick);};tick();
      return;
    }catch(e){/* fall through to ZXing */}
  }
  // Fallback path (Safari/iPhone + everyone else): ZXing from CDN
  try{
    await loadZXing();
    _zxing=new ZXing.BrowserMultiFormatReader();
    await _zxing.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},vid,(result,err)=>{
      if(result&&el.classList.contains("on")){const code=result.getText();stopScan();lookupBarcode(code);}
    });
  }catch(e){stopScan();toast("No pude abrir la cámara aquí");}
}
function stopScan(){const el=document.getElementById("scan");el.classList.remove("on");if(scanRAF)cancelAnimationFrame(scanRAF);if(_zxing){try{_zxing.reset();}catch(e){}_zxing=null;}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}

/* ---- CUERPO: InBody (composición corporal, valores manuales) ---- */
function ibVal(v){if(v==null)return '<span style="color:var(--dim);font-weight:800">—</span>';const s=(''+v).split('.');return s[0]+(s[1]?`<small>.${s[1]}</small>`:'');}
function inbodyModule(){
  const ib=S.inbody||{};
  const cell=(m)=>{
    const o=ib[m.k]||{};const c=o.c!=null?o.c:null;const p=o.p!=null?o.p:null;
    let pill='';
    if(c!=null&&p!=null){
      const d=+(c-p).toFixed(2);
      if(Math.abs(d)<0.05){pill=`<span class="ibd same">Igual</span>`;}
      else{const up=d>0;const good=(m.dir==="up")===up;pill=`<span class="ibd ${good?'good':'bad'}">${up?'▲':'▼'}${Math.abs(d).toFixed(1)}</span>`;}
    }else if(c!=null){pill=`<span class="ibd same">—</span>`;}
    const prev=p!=null?`<div class="ibp">antes ${p}</div>`:'';
    return `<div class="ibx" onclick="openInbody()">
      <div class="ibl">${m.lbl}${m.unit?`<small>(${m.unit})</small>`:''}</div>
      <div class="ibv">${ibVal(c)}</div>
      ${pill}${prev}</div>`;
  };
  return `<div class="sec-title" style="color:var(--cuerpo)">InBody · composición
     <button onclick="event.stopPropagation();openInbody()" style="margin-left:auto;font-family:'JetBrains Mono';font-size:11px;color:var(--cuerpo);border:1px solid var(--line);border-radius:8px;padding:4px 11px;background:rgba(67,214,160,.06)">Editar</button></div>
   <div class="inbody">${INBODY.map(cell).join('')}</div>`;
}
function openInbody(){
  const ib=S.inbody||{};
  openSheet(`<h3>InBody · valores</h3>
   <div class="mono dim" style="font-size:11px;margin-bottom:14px;line-height:1.6">Pon el valor de tu último test y el anterior. El color muestra si <b style="color:#2FB985">mejoraste</b>, <b style="color:#E5586B">empeoraste</b> o quedaste igual. (Peso, grasa corporal y visceral: bajar es mejor · Músculo: subir es mejor.)</div>
   ${INBODY.map(m=>{const o=ib[m.k]||{};return `<div style="margin-bottom:13px"><div style="font-size:13.5px;font-weight:600;margin-bottom:6px">${m.lbl}${m.unit?` (${m.unit})`:''}</div>

function saveInbody(){

  INBODY.forEach(m=>{const c=document.getElementById('ib_'+m.k+'_c').value;const p=document.getElementById('ib_'+m.k+'_p').value;

function videoModule(p){

function ytId(url){if(!url)return"";url=url.trim();
  // ya es un id de 11 chars
  if(/^[\w-]{11}$/.test(url))return url;
  let m;
  m=url.match(/[?&]v=([\w-]{11})/);if(m)return m[1];
  m=url.match(/youtu\.be\/([\w-]{11})/);if(m)return m[1];
  m=url.match(/\/(?:embed|shorts|v|live)\/([\w-]{11})/);if(m)return m[1];
  m=url.match(/([\w-]{11})/);return m?m[1]:"";}
function ytThumb(id){return id?`https://i.ytimg.com/vi/${id}/mqdefault.jpg`:"";}
function vidRow(v,i){const id=v.id||ytId(v.url);const th=ytThumb(id);
  return `<div class="vid" onclick="playVideo(${i})">
  <div class="thumb">${th?`<img src="${th}" loading="lazy" alt="">`:""}<svg class="play" viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M10 8l6 4-6 4z"/></svg></div>
  <div style="flex:1;min-width:0"><div class="cat">${esc(v.cat)}</div><div class="t">${esc(v.title||"Video")}</div></div>
  <button class="del" onclick="event.stopPropagation();delVideo(${i})" style="color:var(--dim);font-size:20px;width:30px">×</button></div>`;}
function playVideo(i){const v=S.videos[i];if(!v)return;const id=v.id||ytId(v.url);
  if(!id){window.open(v.url,"_blank");return;}
  document.getElementById("vptitle").textContent=v.title||"Video";

  document.getElementById("vpyt").href=`https://www.youtube.com/watch?v=${id}`;
  document.getElementById("vplayer").classList.add("on");}
function closeVideo(){document.getElementById("vpframe").innerHTML="";document.getElementById("vplayer").classList.remove("on");}

   <button class="pillbtn ghost" style="width:100%;margin-bottom:8px" onclick="exportData()">⬇︎ Exportar respaldo (.json)</button>
   <label class="pillbtn ghost" style="width:100%;display:flex">⬆︎ Importar respaldo<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label>
   <div class="dim mono" style="font-size:10.5px;margin-top:10px;line-height:1.6">Tus frases y versos son editables — revisa que las atribuciones te cuadren. Todo se guarda en este dispositivo; usa "Exportar" para respaldar o mover tus datos. v2.0 · Mente·Cuerpo·Alma</div>`);
}
function saveSettings(){S.profile.name=document.getElementById("sn").value.trim()||"Juan";S.profile.wake=document.getElementById("sw").value||"05:30";
  S.goals.kcal=+document.getElementById("gk").value||1996;S.goals.p=+document.getElementById("gp").value||220;S.goals.c=+document.getElementById("gc").value||180;S.goals.f=+document.getElementById("gf").value||44;
  closeSheet();render();toast("Guardado");}
async function exportData(){const data=JSON.stringify(S,null,2);
  const dl=(typeof claude!=="undefined"&&claude&&claude.use)?await claude.use("downloads").catch(()=>null):null;
  if(dl){try{await dl.save({filename:"alza-respaldo-"+todayKey()+".json",data});toast("Respaldo listo");return;}catch(e){if(e&&e.code==="declined")return;}}
  try{const b=new Blob([data],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="alza-respaldo.json";a.click();}catch(e){toast("No pude exportar aquí");}}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),o,{ui:{tab:"panel"}});save();closeSheet();render();toast("Datos importados");}catch(e){toast("Archivo no válido");}};r.readAsText(f);}

/* ============ SHEET ============ */
function openSheet(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("on");}
function closeSheet(){document.getElementById("modal").classList.remove("on");}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet();});
if(S.whoop&&S.whoop.on)setTimeout(()=>syncWhoop(true),400);

render();

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
